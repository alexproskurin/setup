name: OpenWiki Update

# Future goal: refresh openwiki/ automatically. Until an OPENAI_API_KEY secret
# is configured, every run skips generation and succeeds with a notice.
# Regenerate locally instead: ask Claude Code to "update the OpenWiki" in this
# repo (the openwiki skill and MCP server are installed at user level).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check OpenWiki credentials
        id: credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            message="OPENAI_API_KEY is not configured, so automatic OpenWiki generation is skipped. Regenerate locally by asking Claude Code to update the OpenWiki."
            echo "::notice title=OpenWiki update skipped::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out repository
        if: ${{ steps.credentials.outputs.available == 'true' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0

      - name: Set up Node.js
        if: ${{ steps.credentials.outputs.available == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        if: ${{ steps.credentials.outputs.available == 'true' }}
        # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
        run: npm install --global openwiki@0.5.1 mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        if: ${{ steps.credentials.outputs.available == 'true' }}
        id: openwiki
        continue-on-error: true
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENWIKI_MODEL_ID: "gpt-5.6-terra"

      - name: Remove transient OpenWiki run state
        if: ${{ !cancelled() && steps.credentials.outputs.available == 'true' }}
        run: rm -f -- openwiki/.run.json

      - name: Create OpenWiki update pull request
        if: ${{ !cancelled() && steps.credentials.outputs.available == 'true' }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            OpenWiki result: ${{ steps.openwiki.outcome }}

            When the result is `failure`, this PR intentionally preserves only the
            pages completed before the failure. Merge it to make that progress the
            baseline for the next scheduled run.

      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
